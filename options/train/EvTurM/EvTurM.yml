  # general settings
name: my
model_type: E2VSRModel
scale: 1
num_gpu: auto  
manual_seed: 0
is_bidirectional: true
use_dis: false
is_pretrain: false  

# dataset and data loader settings
datasets:
  train:
    name: REDS
    type: REDSWithEventsDataset
    dataroot_gt: datasets/try/train/gt
    dataroot_lq: datasets/try/train/turb
    meta_info_file: basicsr/data/meta_info/meta_info_evturm_h5_train.txt
    is_event: true
    is_bidirectional: true
    io_backend:
      type: hdf5
    num_frame: 30
    gt_size: 64
    interval_list: [1]
    random_reverse: false
    use_hflip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 200
    prefetch_mode: cuda
    pin_memory: true

  val:
    name: REDS4
    type: REDSWithEventsTestDataset
    dataroot_gt: datasets/try/val/gt
    dataroot_lq: datasets/try/val/turb
    meta_info_file: basicsr/data/meta_info/meta_info_evturm_h5_val.txt
    is_event: true
    is_bidirectional: true
    scale: 1
    io_backend:
      type: hdf5

# network structures
network_g:
  type: EvTurM
  num_feat: 64
  num_block: 30
  spynet_path: experiments/pretrained_models/flownet/spynet_sintel_final-3d2a1287.pth

# path
path:
  pretrain_network_g: experiments/my1/models/EvTurM.pth  
  strict_load_g: true
  resume_state: ~

# training settings
train:
  amp: false
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 8e-7
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [100000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 300000
  warmup_iter: 15000 
  fix_flow: 10000
  flow_lr_mul: 0.125

  # losses
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 1e3
  save_img: false

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e3
  use_tb_logger: true
  wandb:
    project: REDS_4x
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500

find_unused_parameters: true
